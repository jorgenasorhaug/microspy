[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# ----------------------------- Project ------------------------------ #


[project]
name = "microspy"
version = "0.1.0"
description = "Particle analysis with the HyperSpy framework"
maintainers = [{name = "Jørgen Sørhaug", email = "jorgen.sorhaug@gmail.com"}]
requires-python = ">=3.12"
readme = "README.md"
keywords=[
    "python",
    "hyperspy",
    "exspy",
    "data analysis",
    "microscopy",
    "electron microscopy",
    "scanning electron microscopy",
    "energy-dispersive X-ray spectroscopy",
    "X-ray energy-dispersive spectroscopy",
    "EDS",
    "EDX",
    "SEM",
]
dependencies = [
    "hyperspy         >= 2.4.0",
    "lazy_loader",
    "matplotlib       >= 3.11.0",
    "numba            >= 0.57",
    "numpy            >= 2.5.0",
    "pandas           >= 2.2.3",
    "scikit-image     >= 0.26.0",
    "scikit-learn",
    "scipy            >=1.18.0",
    "tabulate         >= 0.10.0",
    "tqdm             >= 4.68.3",
]

# ------------------------------- Tool ------------------------------- #


[tool.setuptools.packages.find]
where = ["src"]

# Include yaml files:
[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

