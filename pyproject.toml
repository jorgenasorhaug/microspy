[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# ----------------------------- Project ------------------------------ #


[project]
name = "microspy"
version = "0.1.0"
description = "Particle and image analysis with the HyperSpy framework"
maintainers = [{name = "Jørgen Sørhaug", email = "jorgen.sorhaug@proton.me"}]
requires-python = ">=3.12"
readme = "README.md"
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords=[
    "python",
    "hyperspy",
    "exspy",
    "data analysis",
    "microscopy",
    "electron microscopy",
    "scanning electron microscopy",
    "energy-dispersive X-ray spectroscopy",
    "X-ray energy-dispersive spectroscopy",
    "EDS",
    "EDX",
    "SEM",
]
dependencies = [
    "hyperspy         >= 2.4.0",
    "h5py             >= 2.10",
    "matplotlib       >= 3.11.0",
    "numpy            >= 2.5.0",
    "pandas           >= 2.2.3",
    "scikit-image     >= 0.26.0",
    "scikit-learn",
    "scipy            >= 1.18.0",
    "tabulate         >= 0.10.0",
    "tqdm             >= 4.68.3",
]
[project.optional-dependencies]
all = [
    "exspy            >= 0.3.0"
]
tests = [
    "pytest>=8",
]
coverage = [
    "pytest-cov>=7",
]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff",
]
# ------------------------------- Tool ------------------------------- #


[tool.setuptools.packages.find]
where = ["src"]

# Include yaml files:
[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["microspy"]

[tool.coverage.report]
precision = 2
show_missing = true

[project.urls]