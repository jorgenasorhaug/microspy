[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# ----------------------------- Project ------------------------------ #


[project]
name = "microspy"
version = "0.1.0"
description = "Particle analysis with the HyperSpy framework"
maintainers = [{name = "Jørgen Sørhaug", email = "jorgen.sorhaug@gmail.com"}]
requires-python = ">=3.12"
readme = "README.md"
keywords=[
    "python",
    "hyperspy",
    "exspy",
    "data analysis",
    "microscopy",
    "electron microscopy",
    "scanning electron microscopy",
    "energy-dispersive X-ray spectroscopy",
    "X-ray energy-dispersive spectroscopy",
    "EDS",
    "EDX",
    "SEM",
    "STEM",
    "TEM",
]
dependencies = [
    "hyperspy         >= 2.4.0",
    "pandas           >= 2.2.3",
    "tabulate         >= 0.9.0",
]

# ------------------------------- Tool ------------------------------- #


[tool.setuptools.packages.find]
where = ["src"]
